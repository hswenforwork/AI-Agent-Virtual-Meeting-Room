name: deploy-functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 部署 Edge Functions
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy chat-dispatch
          supabase functions deploy agent-run
          supabase functions deploy approval-decide
          supabase functions deploy file-register
          supabase functions deploy worker-task-start
          supabase functions deploy save-api-key
          supabase functions deploy delete-api-key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
